name: Refresh StatusPulse data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect official public status feeds
        run: python3 collect.py
      - name: Regenerate page and sample
        run: python3 generate_site.py
      - name: Commit refreshed release
        run: |
          git config user.name 'statusfeed-dev'
          git config user.email 'statusfeed-dev@users.noreply.github.com'
          git add statusfeed.db index.html statuspulse-sample.csv
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Refresh StatusPulse incident data'
            git push
          fi
