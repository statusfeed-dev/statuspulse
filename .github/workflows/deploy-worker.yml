name: Deploy StatusPulse fulfillment Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - worker.test.mjs
      - package.json
      - schema.sql
      - migrations/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statuspulse-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test production Worker contract
        run: npm test

      - name: Ensure Cloudflare resources exist
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          databases=$(curl --fail --silent "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/d1/database")
          db_id=$(printf '%s' "$databases" | jq -r '.result[] | select(.name=="statuspulse") | .uuid' | head -n1)
          if [ -z "$db_id" ]; then
            created=$(curl --fail --silent -X POST "${auth[@]}" "$api/accounts/$CF_ACCOUNT_ID/d1/database" --data '{"name":"statuspulse"}')
            db_id=$(printf '%s' "$created" | jq -r '.result.uuid')
          fi
          printf '%s\n' "$db_id" > .d1-id
          printf '%s\n' "$CF_ACCOUNT_ID" > .account-id

      - name: Write deployment configuration
        env:
          STATUSPULSE_ALLOW_LIVE: ${{ vars.STATUSPULSE_ALLOW_LIVE }}
          STATUSPULSE_PAYMENT_LINK_ID: ${{ vars.STATUSPULSE_PAYMENT_LINK_ID }}
        run: |
          set -euo pipefail
          if [ "$STATUSPULSE_ALLOW_LIVE" != 'true' ] && [ "$STATUSPULSE_ALLOW_LIVE" != 'false' ]; then
            echo 'STATUSPULSE_ALLOW_LIVE must be true or false' >&2
            exit 1
          fi
          if [[ ! "$STATUSPULSE_PAYMENT_LINK_ID" =~ ^plink_[A-Za-z0-9]+$ ]]; then
            echo 'STATUSPULSE_PAYMENT_LINK_ID is missing or invalid' >&2
            exit 1
          fi
          account_id=$(cat .account-id)
          database_id=$(cat .d1-id)
          if [[ ! "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo 'Cloudflare account ID is invalid' >&2
            exit 1
          fi
          if [[ ! "$database_id" =~ ^[A-Fa-f0-9-]{32,40}$ ]]; then
            echo 'Cloudflare D1 database ID is invalid' >&2
            exit 1
          fi
          cat > wrangler.jsonc <<EOF
          {
            "name": "statuspulse-fulfillment",
            "main": "worker.js",
            "compatibility_date": "2026-08-27",
            "compatibility_flags": ["nodejs_compat"],
            "account_id": "$account_id",
            "vars": {
              "STATUSPULSE_ALLOW_LIVE": "$STATUSPULSE_ALLOW_LIVE",
              "STATUSPULSE_PAYMENT_LINK_ID": "$STATUSPULSE_PAYMENT_LINK_ID"
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "statuspulse",
                "database_id": "$database_id",
                "migrations_dir": "migrations"
              }
            ],
            "triggers": {
              "crons": []
            },
            "observability": {
              "enabled": true,
              "head_sampling_rate": 1
            }
          }
          EOF

      - name: Archive legacy Stripe events and preflight migration
        run: |
          set -euo pipefail
          migration_name='0001_statuspulse_order_state_v2.sql'

          d1_scalar() {
            local sql="$1"
            npx --yes wrangler@4.125.0 d1 execute statuspulse --remote --json \
              --command "$sql" \
              | jq -er '
                  if length == 1
                     and (.[0].results | length) == 1
                     and (.[0].results[0] | has("value"))
                  then .[0].results[0].value
                  else error("unexpected D1 response shape")
                  end
                '
          }

          table_object_type() {
            local table="$1"
            case "$table" in
              d1_migrations|stripe_events|legacy_stripe_events_v1|entitlements|access_sessions|deliveries|funnel_events|orders|order_events|refunds|risk_events|rejected_events) ;;
              *) echo "Refusing unsafe table identifier: $table" >&2; return 1 ;;
            esac
            d1_scalar "SELECT COALESCE((SELECT type FROM sqlite_master WHERE name='$table'), 'absent') AS value"
          }

          legacy_event_schema_ok() {
            local table="$1"
            case "$table" in
              stripe_events|legacy_stripe_events_v1) ;;
              *) echo "Refusing unsafe archive identifier: $table" >&2; return 1 ;;
            esac
            d1_scalar "SELECT CASE WHEN
              (SELECT COUNT(*) FROM pragma_table_info('$table')) = 2
              AND (SELECT COUNT(*) FROM pragma_table_info('$table')
                    WHERE cid=0 AND name='event_id' AND upper(type)='TEXT'
                      AND \"notnull\"=0 AND dflt_value IS NULL AND pk=1) = 1
              AND (SELECT COUNT(*) FROM pragma_table_info('$table')
                    WHERE cid=1 AND name='processed_at' AND upper(type)='INTEGER'
                      AND \"notnull\"=1 AND dflt_value IS NULL AND pk=0) = 1
            THEN 1 ELSE 0 END AS value"
          }

          migrations_type=$(table_object_type d1_migrations)
          migration_applied=0
          case "$migrations_type" in
            table)
              migration_applied=$(d1_scalar \
                "SELECT COUNT(*) AS value FROM d1_migrations WHERE name='$migration_name'")
              ;;
            absent) ;;
            *)
              echo "Refusing migration: d1_migrations is a $migrations_type, not a table." >&2
              exit 1
              ;;
          esac
          if [ "$migration_applied" != '0' ] && [ "$migration_applied" != '1' ]; then
            echo "Refusing migration: ambiguous migration history for $migration_name." >&2
            exit 1
          fi

          if [ "$migration_applied" = '0' ]; then
            stripe_type=$(table_object_type stripe_events)
            archive_type=$(table_object_type legacy_stripe_events_v1)
            case "$stripe_type:$archive_type" in
              table:absent)
                if [ "$(legacy_event_schema_ok stripe_events)" != '1' ]; then
                  echo 'Refusing migration: stripe_events does not match the exact legacy schema.' >&2
                  exit 1
                fi
                legacy_event_count=$(d1_scalar \
                  'SELECT COUNT(*) AS value FROM stripe_events')
                npx --yes wrangler@4.125.0 d1 execute statuspulse --remote \
                  --command 'ALTER TABLE stripe_events RENAME TO legacy_stripe_events_v1' \
                  >/dev/null
                if [ "$(table_object_type stripe_events)" != 'absent' ] \
                   || [ "$(table_object_type legacy_stripe_events_v1)" != 'table' ] \
                   || [ "$(legacy_event_schema_ok legacy_stripe_events_v1)" != '1' ]; then
                  echo 'Legacy Stripe event archive rename did not produce the expected schema.' >&2
                  exit 1
                fi
                archived_event_count=$(d1_scalar \
                  'SELECT COUNT(*) AS value FROM legacy_stripe_events_v1')
                if [ "$archived_event_count" != "$legacy_event_count" ]; then
                  echo 'Legacy Stripe event archive row count changed during rename.' >&2
                  exit 1
                fi
                ;;
              absent:table)
                if [ "$(legacy_event_schema_ok legacy_stripe_events_v1)" != '1' ]; then
                  echo 'Refusing migration: existing legacy archive schema is invalid.' >&2
                  exit 1
                fi
                ;;
              absent:absent) ;;
              table:table)
                echo 'Refusing migration: stripe_events and its legacy archive both exist.' >&2
                exit 1
                ;;
              *)
                echo "Refusing migration: ambiguous Stripe event objects ($stripe_type/$archive_type)." >&2
                exit 1
                ;;
            esac

            for table in entitlements access_sessions deliveries funnel_events orders order_events refunds risk_events rejected_events; do
              table_type=$(table_object_type "$table")
              case "$table_type" in
                absent) continue ;;
                table) ;;
                *)
                  echo "Refusing migration: $table is a $table_type, not a table." >&2
                  exit 1
                  ;;
              esac
              row_count=$(d1_scalar "SELECT COUNT(*) AS value FROM $table")
              if [ "$row_count" != '0' ]; then
                echo "Refusing migration: business table $table has $row_count row(s)." >&2
                exit 1
              fi
            done
          else
            if [ "$(table_object_type stripe_events)" != 'absent' ]; then
              echo 'Refusing deploy: stripe_events reappeared after migration was applied.' >&2
              exit 1
            fi
          fi

          archive_type=$(table_object_type legacy_stripe_events_v1)
          case "$archive_type" in
            absent)
              printf '%s\n' absent > .legacy-stripe-event-count
              ;;
            table)
              if [ "$(legacy_event_schema_ok legacy_stripe_events_v1)" != '1' ]; then
                echo 'Refusing deploy: legacy Stripe event archive schema is invalid.' >&2
                exit 1
              fi
              d1_scalar 'SELECT COUNT(*) AS value FROM legacy_stripe_events_v1' \
                > .legacy-stripe-event-count
              ;;
            *)
              echo "Refusing deploy: legacy Stripe event archive is a $archive_type." >&2
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply versioned D1 migrations
        run: npx --yes wrangler@4.125.0 d1 migrations apply statuspulse --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 schema contract
        run: |
          set -euo pipefail
          schema_result=$(npx --yes wrangler@4.125.0 d1 execute statuspulse --remote --json --command \
            "SELECT CASE WHEN
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('orders','order_events','refunds','risk_events','rejected_events','schema_versions')) = 6
              AND (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name IN ('checkout_state','checkout_event_created_at','eligibility_state','fulfillment_state')) = 4
              AND (SELECT COUNT(*) FROM pragma_table_info('refunds') WHERE name='stripe_created_at') = 1
              AND (SELECT COUNT(*) FROM pragma_table_info('risk_events') WHERE name='stripe_created_at') = 1
              AND COALESCE((SELECT MAX(version) FROM schema_versions), 0) >= 2
            THEN 1 ELSE 0 END AS ok")
          printf '%s' "$schema_result" | jq -e '.[0].results[0].ok == 1' >/dev/null

          expected_archive_count=$(cat .legacy-stripe-event-count)
          if [[ ! "$expected_archive_count" =~ ^(absent|[0-9]+)$ ]]; then
            echo 'Invalid legacy Stripe event archive expectation.' >&2
            exit 1
          fi
          archive_type_result=$(npx --yes wrangler@4.125.0 d1 execute statuspulse --remote --json --command \
            "SELECT COALESCE((SELECT type FROM sqlite_master WHERE name='legacy_stripe_events_v1'), 'absent') AS type")
          archive_type=$(printf '%s' "$archive_type_result" | jq -er '.[0].results[0].type')
          if [ "$expected_archive_count" = 'absent' ]; then
            if [ "$archive_type" != 'absent' ]; then
              echo 'Unexpected legacy Stripe event archive appeared during migration.' >&2
              exit 1
            fi
          else
            if [ "$archive_type" != 'table' ]; then
              echo 'Legacy Stripe event archive disappeared during migration.' >&2
              exit 1
            fi
            archive_result=$(npx --yes wrangler@4.125.0 d1 execute statuspulse --remote --json --command \
              "SELECT CASE WHEN
                (SELECT COUNT(*) FROM pragma_table_info('legacy_stripe_events_v1')) = 2
                AND (SELECT COUNT(*) FROM pragma_table_info('legacy_stripe_events_v1')
                      WHERE cid=0 AND name='event_id' AND upper(type)='TEXT'
                        AND \"notnull\"=0 AND dflt_value IS NULL AND pk=1) = 1
                AND (SELECT COUNT(*) FROM pragma_table_info('legacy_stripe_events_v1')
                      WHERE cid=1 AND name='processed_at' AND upper(type)='INTEGER'
                        AND \"notnull\"=1 AND dflt_value IS NULL AND pk=0) = 1
                AND (SELECT COUNT(*) FROM legacy_stripe_events_v1) = $expected_archive_count
              THEN 1 ELSE 0 END AS ok")
            printf '%s' "$archive_result" | jq -e '.[0].results[0].ok == 1' >/dev/null
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and Stripe secret atomically
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          test -n "$STRIPE_WEBHOOK_SECRET"
          umask 077
          secrets_file="${RUNNER_TEMP}/statuspulse-worker-secrets.env"
          printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET" > "$secrets_file"
          npx --yes wrangler@4.125.0 deploy --secrets-file "$secrets_file"

      - name: Validate Worker health response
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          worker_url=$(jq -r \
            'select(.type == "deploy") | .targets[0] // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          case "$worker_url" in
            https://*) ;;
            *)
              echo 'Wrangler did not report a valid HTTPS deployment target' >&2
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "${worker_url%/}/healthz" >/dev/null

      - name: Remove temporary files
        if: always()
        run: rm -f .d1-id .account-id .legacy-stripe-event-count wrangler.jsonc "${RUNNER_TEMP}/statuspulse-worker-secrets.env"
