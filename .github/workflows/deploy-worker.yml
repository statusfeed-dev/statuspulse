name: Deploy StatusPulse fulfillment Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - worker.test.mjs
      - package.json
      - schema.sql
      - migrations/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statuspulse-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test production Worker contract
        run: npm test

      - name: Ensure isolated v2 database exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          database_name='statuspulse-v2'
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          databases=$(curl --fail --silent "${auth[@]}" \
            "$api/accounts/$CF_ACCOUNT_ID/d1/database?name=$database_name&per_page=100")
          printf '%s' "$databases" \
            | jq -e '.success == true and (.result | type == "array")' >/dev/null
          match_count=$(printf '%s' "$databases" \
            | jq -r --arg name "$database_name" \
              '[.result[] | select(.name == $name)] | length')
          case "$match_count" in
            0)
              created=$(curl --fail --silent -X POST "${auth[@]}" \
                "$api/accounts/$CF_ACCOUNT_ID/d1/database" \
                --data "{\"name\":\"$database_name\"}")
              printf '%s' "$created" \
                | jq -e --arg name "$database_name" \
                  '.success == true and .result.name == $name' >/dev/null
              db_id=$(printf '%s' "$created" | jq -r '.result.uuid')
              ;;
            1)
              db_id=$(printf '%s' "$databases" \
                | jq -r --arg name "$database_name" \
                  '.result[] | select(.name == $name) | .uuid')
              ;;
            *)
              echo "Refusing deploy: found $match_count databases named $database_name." >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$db_id" > .d1-v2-id
          printf '%s\n' "$CF_ACCOUNT_ID" > .account-id

      - name: Write deployment configuration
        env:
          STATUSPULSE_ALLOW_LIVE: ${{ vars.STATUSPULSE_ALLOW_LIVE }}
          STATUSPULSE_PAYMENT_LINK_ID: ${{ vars.STATUSPULSE_PAYMENT_LINK_ID }}
        run: |
          set -euo pipefail
          if [ "$STATUSPULSE_ALLOW_LIVE" != 'true' ] && [ "$STATUSPULSE_ALLOW_LIVE" != 'false' ]; then
            echo 'STATUSPULSE_ALLOW_LIVE must be true or false' >&2
            exit 1
          fi
          if [[ ! "$STATUSPULSE_PAYMENT_LINK_ID" =~ ^plink_[A-Za-z0-9]+$ ]]; then
            echo 'STATUSPULSE_PAYMENT_LINK_ID is missing or invalid' >&2
            exit 1
          fi
          account_id=$(cat .account-id)
          database_id=$(cat .d1-v2-id)
          if [[ ! "$account_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo 'Cloudflare account ID is invalid' >&2
            exit 1
          fi
          if [[ ! "$database_id" =~ ^[A-Fa-f0-9-]{32,40}$ ]]; then
            echo 'Cloudflare D1 database ID is invalid' >&2
            exit 1
          fi
          cat > wrangler.jsonc <<EOF
          {
            "name": "statuspulse-fulfillment",
            "main": "worker.js",
            "compatibility_date": "2026-08-27",
            "compatibility_flags": ["nodejs_compat"],
            "account_id": "$account_id",
            "vars": {
              "STATUSPULSE_ALLOW_LIVE": "$STATUSPULSE_ALLOW_LIVE",
              "STATUSPULSE_PAYMENT_LINK_ID": "$STATUSPULSE_PAYMENT_LINK_ID"
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "statuspulse-v2",
                "database_id": "$database_id",
                "migrations_dir": "migrations"
              }
            ],
            "triggers": {
              "crons": []
            },
            "observability": {
              "enabled": true,
              "head_sampling_rate": 1
            }
          }
          EOF

      - name: Validate isolated v2 migration state
        run: |
          set -euo pipefail
          migration_name='0001_statuspulse_order_state_v2.sql'

          d1_scalar() {
            local sql="$1"
            npx --yes wrangler@4.125.0 d1 execute statuspulse-v2 --remote --json \
              --command "$sql" \
              | jq -er '
                  if length == 1
                     and (.[0].results | length) == 1
                     and (.[0].results[0] | has("value"))
                  then .[0].results[0].value
                  else error("unexpected D1 response shape")
                  end
                '
          }

          migrations_type=$(d1_scalar \
            "SELECT COALESCE((SELECT type FROM sqlite_master WHERE name='d1_migrations'), 'absent') AS value")
          migration_count=0
          migration_applied=0
          case "$migrations_type" in
            absent) ;;
            table)
              migration_count=$(d1_scalar \
                'SELECT COUNT(*) AS value FROM d1_migrations')
              migration_applied=$(d1_scalar \
                "SELECT COUNT(*) AS value FROM d1_migrations WHERE name='$migration_name'")
              ;;
            *)
              echo "Refusing deploy: d1_migrations is a $migrations_type, not a table." >&2
              exit 1
              ;;
          esac

          if [ "$migration_count" = '0' ] && [ "$migration_applied" = '0' ]; then
            application_objects=$(d1_scalar \
              "SELECT COUNT(*) AS value FROM sqlite_master
                WHERE name NOT LIKE 'sqlite_%'
                  AND name NOT LIKE '_cf_%'
                  AND name <> 'd1_migrations'")
            if [ "$application_objects" != '0' ]; then
              object_names=$(d1_scalar \
                "SELECT COALESCE(group_concat(name, ','), 'unknown') AS value
                   FROM sqlite_master
                  WHERE name NOT LIKE 'sqlite_%'
                    AND name NOT LIKE '_cf_%'
                    AND name <> 'd1_migrations'")
              echo "Refusing migration: statuspulse-v2 contains unexpected objects: $object_names" >&2
              exit 1
            fi
          elif [ "$migration_count" = '1' ] && [ "$migration_applied" = '1' ]; then
            : # Proper migration history; the exact schema is checked after the no-op apply.
          else
            echo 'Refusing deploy: statuspulse-v2 has unexpected migration history.' >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply versioned D1 migrations
        run: npx --yes wrangler@4.125.0 d1 migrations apply statuspulse-v2 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 schema contract
        run: |
          set -euo pipefail
          schema_result=$(npx --yes wrangler@4.125.0 d1 execute statuspulse-v2 --remote --json --command \
            "SELECT CASE WHEN
              (SELECT COUNT(*) FROM d1_migrations) = 1
              AND (SELECT COUNT(*) FROM d1_migrations
                    WHERE name='0001_statuspulse_order_state_v2.sql') = 1
              AND (SELECT COUNT(*) FROM sqlite_master
                    WHERE name NOT LIKE 'sqlite_%'
                      AND name NOT LIKE '_cf_%'
                      AND name <> 'd1_migrations') = 12
              AND (SELECT COUNT(*) FROM sqlite_master
                    WHERE type='table' AND name IN (
                      'orders', 'order_events', 'refunds', 'risk_events',
                      'rejected_events', 'schema_versions'
                    )) = 6
              AND (SELECT COUNT(*) FROM sqlite_master
                    WHERE type='index' AND name IN (
                      'orders_payment_state_idx', 'orders_fulfillment_state_idx',
                      'order_events_object_idx', 'refunds_payment_intent_idx',
                      'risk_events_payment_intent_idx',
                      'rejected_events_unresolved_idx'
                    )) = 6
              AND (SELECT COUNT(*) FROM pragma_table_info('orders')) = 19
              AND (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name IN (
                    'checkout_session_id', 'payment_link_id', 'payment_intent_id',
                    'offer_id', 'offer_version', 'amount_subtotal', 'amount_tax',
                    'amount_total', 'currency', 'checkout_state',
                    'checkout_event_created_at', 'eligibility_state', 'payment_state',
                    'fulfillment_state', 'refunded_amount', 'created_at', 'updated_at',
                    'paid_at', 'delivered_at'
                  )) = 19
              AND (SELECT COUNT(*) FROM pragma_table_info('order_events')) = 6
              AND (SELECT COUNT(*) FROM pragma_table_info('order_events') WHERE name IN (
                    'event_id', 'event_type', 'object_id', 'object_state',
                    'stripe_created_at', 'processed_at'
                  )) = 6
              AND (SELECT COUNT(*) FROM pragma_table_info('refunds')) = 8
              AND (SELECT COUNT(*) FROM pragma_table_info('refunds') WHERE name IN (
                    'refund_id', 'payment_intent_id', 'amount', 'currency', 'status',
                    'stripe_created_at', 'created_at', 'updated_at'
                  )) = 8
              AND (SELECT COUNT(*) FROM pragma_table_info('risk_events')) = 7
              AND (SELECT COUNT(*) FROM pragma_table_info('risk_events') WHERE name IN (
                    'risk_id', 'payment_intent_id', 'risk_type', 'status', 'disposition',
                    'stripe_created_at', 'updated_at'
                  )) = 7
              AND (SELECT COUNT(*) FROM pragma_table_info('rejected_events')) = 8
              AND (SELECT COUNT(*) FROM pragma_table_info('rejected_events') WHERE name IN (
                    'event_id', 'event_type', 'object_id', 'reason_code', 'first_seen_at',
                    'last_seen_at', 'attempt_count', 'resolved_at'
                  )) = 8
              AND (SELECT COUNT(*) FROM pragma_table_info('schema_versions')) = 2
              AND (SELECT COUNT(*) FROM pragma_table_info('schema_versions')
                    WHERE name IN ('version', 'applied_at')) = 2
              AND (SELECT COUNT(*) FROM schema_versions WHERE version=2) = 1
              AND (SELECT COUNT(*) FROM schema_versions) = 1
            THEN 1 ELSE 0 END AS ok")
          printf '%s' "$schema_result" | jq -e '.[0].results[0].ok == 1' >/dev/null

          remote_definitions=$(npx --yes wrangler@4.125.0 d1 execute statuspulse-v2 \
            --remote --json --command \
            "SELECT name, type, sql FROM sqlite_master
              WHERE name NOT LIKE 'sqlite_%'
                AND name NOT LIKE '_cf_%'
                AND name <> 'd1_migrations'
              ORDER BY type, name")
          actual_schema=$(printf '%s' "$remote_definitions" | jq -ceS '
            if length == 1 and (.[0].results | type == "array")
            then .[0].results
            else error("unexpected D1 schema response shape")
            end
          ')
          expected_schema=$(
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { DatabaseSync } from "node:sqlite";
              const database = new DatabaseSync(":memory:");
              database.exec(readFileSync("schema.sql", "utf8"));
              const rows = database.prepare(`
                SELECT name, type, sql FROM sqlite_master
                  WHERE name NOT LIKE ?
                    AND name NOT LIKE ?
                    AND name <> ?
                  ORDER BY type, name
              `).all("sqlite_%", "_cf_%", "d1_migrations")
                .map((row) => ({ ...row }));
              database.close();
              process.stdout.write(JSON.stringify(rows));
            ' | jq -ceS '.'
          )
          if [ "$actual_schema" != "$expected_schema" ]; then
            echo 'Refusing deploy: statuspulse-v2 schema definitions drifted.' >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and Stripe secret atomically
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          test -n "$STRIPE_WEBHOOK_SECRET"
          umask 077
          secrets_file="${RUNNER_TEMP}/statuspulse-worker-secrets.env"
          printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET" > "$secrets_file"
          npx --yes wrangler@4.125.0 deploy --secrets-file "$secrets_file"

      - name: Validate Worker health response
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          worker_url=$(jq -r \
            'select(.type == "deploy") | .targets[0] // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          case "$worker_url" in
            https://*) ;;
            *)
              echo 'Wrangler did not report a valid HTTPS deployment target' >&2
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "${worker_url%/}/healthz" >/dev/null

      - name: Remove temporary files
        if: always()
        run: rm -f .d1-v2-id .account-id wrangler.jsonc "${RUNNER_TEMP}/statuspulse-worker-secrets.env"
