name: Deploy StatusPulse Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify generated release is fresh and internally consistent
        run: |
          python3 - <<'PY'
          import json, sqlite3
          db = sqlite3.connect('statusfeed.db')
          total = db.execute('SELECT COUNT(*) FROM incidents').fetchone()[0]
          stats = json.load(open('stats.json'))
          assert stats['total'] == total, (stats['total'], total)
          assert stats['last30d'] >= 0
          assert stats['unresolved'] == db.execute("SELECT COUNT(*) FROM incidents WHERE status != 'resolved'").fetchone()[0]
          print(f'validated total={total} last30d={stats["last30d"]} unresolved={stats["unresolved"]}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page
        run: curl --fail --silent --show-error "${{ steps.deployment.outputs.page_url }}" >/dev/null
